<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="name">이름:</label><br>
        <input type="text" id="name" name="name" value="Kim"><br>
        <label for="affiliation">소속:</label><br>
        <input type="text" id="affiliation" name="affiliation" value="SIAT"><br><br>
        <input type="submit" value="전송"> <!-- value를 지워보고 바꿔보기 -->
        <input type="reset" value="초기화">
    </form>
    <form id="inputform">
        <label>이름</label>
        <input="text">
        <input type="submit" value="전송">

    </form>

    



    <p id="result"></p>

    <script>
    const form = document.querySelector('#inputform');
    const result = document.querySelector('#result');

    form.addEventListener('submit', function (event) {
        event.preventDefault();

        const input = form.elements.namedItem('userName');
        result.textContent = `입력한 이름: ${input.value}`;
    });
    </script>
</body>
</html>
