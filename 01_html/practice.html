<!DOCTYPE html>
<!-- HTML5 문서임을 선언합니다. -->
<html lang="ko">
<!-- 문서의 기본 언어가 한국어임을 표시합니다. -->
<head>
	<!-- 문서의 메타 정보를 담는 영역입니다. -->
	<meta charset="UTF-8">
	<!-- 한글이 깨지지 않도록 문자 인코딩을 지정합니다. -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- 모바일 화면에서도 기기 너비에 맞게 표시합니다. -->
	<title>계좌 카드</title>
	<!-- 브라우저 탭에 표시할 문서 제목입니다. -->
</head>
<!-- 사용자에게 실제로 보이는 내용을 담는 영역입니다. -->
<body>
	<!-- 페이지의 주요 콘텐츠임을 나타냅니다. -->
	<main>
		<!-- 하나의 독립적인 계좌 카드 콘텐츠를 나타냅니다. -->
		<article>
			<!-- 계좌 카드의 제목 영역을 나타냅니다. -->
			<header>
				<!-- 계좌 카드의 가장 중요한 제목을 나타냅니다. -->
				<h1>우리은행</h1>
			</header>

			<!-- 계좌 정보의 이름과 값을 연결해 표현합니다. -->
			<dl>
				<!-- 계좌번호 정보의 이름을 나타냅니다. -->
				<dt>계좌번호</dt>
				<!-- 계좌번호 값을 보안을 위해 일부 마스킹하여 표시합니다. -->
				<dd>1002-***-123456</dd>

				<!-- 잔액 정보의 이름을 나타냅니다. -->
				<dt>잔액</dt>
				<!-- 계좌의 현재 잔액 값을 나타냅니다. -->
				<dd>1,250,000원</dd>
			</dl>

			<!-- 계좌에서 수행할 수 있는 동작을 묶습니다. -->
			<nav aria-label="계좌 동작">
				<!-- 이체 기능을 실행하는 버튼입니다. -->
				<button type="button">이체</button>
				<!-- 계좌 상세 정보를 확인하는 버튼입니다. -->
				<button type="button">상세</button>
			</nav>
		</article>
	</main>
</body>
</html>
